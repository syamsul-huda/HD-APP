name: Generate Keystore (jalankan sekali)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias hdapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HD-APP, OU=Mobile, O=SyamsulHuda, L=Indonesia, S=Indonesia, C=ID" \
            -storepass hdapp123 \
            -keypass hdapp123

      - name: Save base64 to file
        run: base64 -w 0 release.keystore > keystore_base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1

      - name: Verify dan print base64 (backup)
        run: |
          echo "FILE_SIZE=$(wc -c < release.keystore) bytes"
          echo "BASE64_LENGTH=$(wc -c < keystore_base64.txt) chars"
          echo "KEYSTORE_BASE64_START:"
          head -c 100 keystore_base64.txt
          echo ""
          echo "KEYSTORE_BASE64_END:"
          tail -c 100 keystore_base64.txt
          echo ""
          echo "FULL_BASE64:"
          cat keystore_base64.txt
