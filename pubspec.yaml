name: super_app_hd
description: SuperApp HD - Video Downloader, Pembaca Dokumen, dan Scanner
publish_to: 'none'
version: 1.0.25+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  open_filex: ^4.3.0
  share_plus: ^9.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  file_picker: ^6.1.0
  flutter_pdfview: ^1.3.2
  archive: ^3.6.1
  xml: ^6.5.0
  cunning_document_scanner: ^1.0.6
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/LICENSE-Carlito.txt
    - assets/fonts/LICENSE-Caladea.txt
    - assets/fonts/LICENSE-Liberation.txt
  # Font yang metriknya sama dengan font Office (Calibri, Cambria, Arial,
  # Times New Roman, Courier New) agar tata letak dokumen tidak bergeser.
  fonts:
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Carlito-Italic.ttf
          style: italic
        - asset: assets/fonts/Carlito-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Caladea
      fonts:
        - asset: assets/fonts/Caladea-Regular.ttf
        - asset: assets/fonts/Caladea-Bold.ttf
          weight: 700
        - asset: assets/fonts/Caladea-Italic.ttf
          style: italic
        - asset: assets/fonts/Caladea-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Liberation Sans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Liberation Serif
      fonts:
        - asset: assets/fonts/LiberationSerif-Regular.ttf
        - asset: assets/fonts/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Liberation Mono
      fonts:
        - asset: assets/fonts/LiberationMono-Regular.ttf
        - asset: assets/fonts/LiberationMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationMono-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationMono-BoldItalic.ttf
          weight: 700
          style: italic
