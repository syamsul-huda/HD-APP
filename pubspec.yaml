name: video_downloader
description: Download video dari media sosial
publish_to: 'none'
version: 1.0.16+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  open_filex: ^4.3.0
  share_plus: ^9.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  file_picker: ^6.1.0
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
